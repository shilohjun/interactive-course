# /etc/nginx/conf.d/interactive-course.conf
# Put these blocks inside the existing `server {}` that already serves `/` on 5173.
# Only add `/course`; do not change the existing root location.

location = /course {
    return 301 /course/;
}

location /course/ {
    proxy_pass http://127.0.0.1:5174/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Video needs to stream; do not buffer the whole 28 MB body.
    proxy_buffering off;
    proxy_read_timeout 300s;

    # Cache fingerprints; the app shell stays fresh.
    proxy_cache_bypass $http_upgrade;
}
